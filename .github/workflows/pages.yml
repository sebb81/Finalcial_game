name: Tester et publier le jeu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Conserver les captures seules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: |
            test-results/**/*.png
            test-results/**/*.md
      - name: Conserver les captures et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa
          path: |
            test-results/
            playwright-report/
            package-lock.json
            dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
